name: Build and publish develop image

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      staging_action:
        description: Staging operation to run from the trusted develop workflow
        required: true
        default: connectivity
        type: choice
        options:
          - connectivity
          - deploy

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Quality checks
    if: github.event_name != 'workflow_dispatch' || inputs.staging_action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Validate deployment script
        run: bash -n deploy/deploy-staging.sh

      - name: Validate staging Compose configuration
        env:
          FRONTEND_IMAGE: ghcr.io/example/frontend:develop-0000000000000000000000000000000000000000
          BACKEND_UPSTREAM: http://api:8080
          APP_NETWORK: staging-app
          FRONTEND_BIND: 127.0.0.1
          FRONTEND_PORT: 8080
        run: docker compose -f deploy/compose.staging.yaml config >/dev/null

  build-and-publish:
    name: Build and publish Docker image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate build metadata
        id: metadata
        shell: bash
        run: |
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:develop-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:develop
          build-args: |
            APP_VERSION=develop
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            VITE_API_BASE_URL=/api
            VITE_APP_NAME=crumb
            VITE_SUPPORT_EMAIL=support@example.com
            VITE_PROFILE_API_MODE=remote
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Check or deploy frontend staging
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.staging_action == 'connectivity') ||
        (
          needs.build-and-publish.result == 'success' &&
          (
            (
              github.event_name == 'pull_request' &&
              github.head_ref == 'fix/staging-vpn-ssh-timeout'
            ) ||
            (github.event_name == 'push' && vars.STAGING_AUTO_DEPLOY_ENABLED == 'true') ||
            (
              github.event_name == 'workflow_dispatch' &&
              inputs.staging_action == 'deploy' &&
              github.ref == 'refs/heads/develop'
            )
          )
        )
      )
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: frontend-staging
      cancel-in-progress: false

    env:
      IMAGE: ghcr.io/${{ github.repository }}:develop-${{ github.sha }}
      EXPECTED_SHA: ${{ github.sha }}
      STAGING_HOST: ${{ vars.STAGING_HOST }}
      STAGING_USER: ${{ vars.STAGING_USER }}
      STAGING_DEPLOY_DIR: ${{ vars.STAGING_DEPLOY_DIR }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      OVPN_CONFIG_B64: ${{ secrets.STAGING_OVPN_CONFIG_B64 }}
      VPN_USERNAME: ${{ secrets.STAGING_VPN_USERNAME }}
      VPN_PASSWORD: ${{ secrets.STAGING_VPN_PASSWORD }}
      VPN_KEY_PASSPHRASE: ${{ secrets.STAGING_VPN_KEY_PASSPHRASE }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_HOST:?Set the STAGING_HOST environment variable}"
          : "${STAGING_USER:?Set the STAGING_USER environment variable}"
          : "${STAGING_DEPLOY_DIR:?Set the STAGING_DEPLOY_DIR environment variable}"
          : "${STAGING_URL:?Set the STAGING_URL environment variable}"
          : "${OVPN_CONFIG_B64:?Set the STAGING_OVPN_CONFIG_B64 secret}"
          : "${SSH_PRIVATE_KEY:?Set the STAGING_SSH_PRIVATE_KEY secret}"
          : "${SSH_KNOWN_HOSTS:?Set the STAGING_SSH_KNOWN_HOSTS secret}"

          [[ "$STAGING_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$STAGING_DEPLOY_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$STAGING_URL" == http://* || "$STAGING_URL" == https://* ]]

      - name: Install OpenVPN
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v openvpn >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes openvpn
          fi

      - name: Connect to staging VPN
        shell: bash
        run: |
          set -euo pipefail

          profile="$RUNNER_TEMP/staging.ovpn"
          auth_file="$RUNNER_TEMP/staging-vpn.auth"
          passphrase_file="$RUNNER_TEMP/staging-vpn.passphrase"
          log_file="$RUNNER_TEMP/staging-openvpn.log"
          pid_file="$RUNNER_TEMP/staging-openvpn.pid"

          printf '%s' "$OVPN_CONFIG_B64" | base64 --decode > "$profile"
          chmod 600 "$profile"

          # A staging VPN must not replace the hosted runner's default route;
          # doing so disconnects the runner from GitHub mid-job.
          sed -i -E '/^[[:space:]]*redirect-gateway([[:space:]].*)?$/d' "$profile"

          if grep -Eq '^[[:space:]]*auth-user-pass' "$profile"; then
            : "${VPN_USERNAME:?The VPN profile requires STAGING_VPN_USERNAME}"
            : "${VPN_PASSWORD:?The VPN profile requires STAGING_VPN_PASSWORD}"
            printf '%s\n%s\n' "$VPN_USERNAME" "$VPN_PASSWORD" > "$auth_file"
            chmod 600 "$auth_file"
            sed -i -E "s|^[[:space:]]*auth-user-pass.*$|auth-user-pass $auth_file|" "$profile"
          fi

          if [[ -n "$VPN_KEY_PASSPHRASE" ]]; then
            printf '%s\n' "$VPN_KEY_PASSPHRASE" > "$passphrase_file"
            chmod 600 "$passphrase_file"
            printf '\naskpass %s\n' "$passphrase_file" >> "$profile"
          fi

          sudo openvpn \
            --config "$profile" \
            --pull-filter ignore redirect-gateway \
            --daemon staging-vpn \
            --writepid "$pid_file" \
            --log "$log_file"

          connected=false
          for attempt in {1..30}; do
            if timeout 2 bash -c "</dev/tcp/$STAGING_HOST/22" 2>/dev/null; then
              connected=true
              break
            fi
            sleep 2
          done

          if [[ "$connected" != true ]]; then
            sudo tail -n 100 "$log_file" || true
            echo "VPN connected, but staging SSH was not reachable" >&2
            exit 1
          fi

          ip route get "$STAGING_HOST"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/staging_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/staging_deploy" "$HOME/.ssh/known_hosts"

          # Secrets copied from Windows may contain CRLF line endings.
          sed -i 's/\r$//' "$HOME/.ssh/staging_deploy" "$HOME/.ssh/known_hosts"

          ssh-keygen -y -f "$HOME/.ssh/staging_deploy" >/dev/null
          ssh-keygen -F "$STAGING_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

          pid_file="$RUNNER_TEMP/staging-openvpn.pid"
          [[ -s "$pid_file" ]]
          sudo kill -0 "$(cat "$pid_file")"
          timeout 2 bash -c "</dev/tcp/$STAGING_HOST/22"

          timeout 30 ssh \
            -i "$HOME/.ssh/staging_deploy" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=2 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=yes \
            "$STAGING_USER@$STAGING_HOST" true

      - name: Deploy exact image and verify staging
        if: >-
          (github.event_name == 'push' && vars.STAGING_AUTO_DEPLOY_ENABLED == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.staging_action == 'deploy')
        shell: bash
        run: |
          set -euo pipefail

          ssh_options=(
            -i "$HOME/.ssh/staging_deploy"
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o ConnectionAttempts=2
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=5
            -o ServerAliveCountMax=2
            -o StrictHostKeyChecking=yes
          )
          target="$STAGING_USER@$STAGING_HOST"

          ssh "${ssh_options[@]}" "$target" "mkdir -p '$STAGING_DEPLOY_DIR'"
          scp "${ssh_options[@]}" \
            deploy/compose.staging.yaml \
            "$target:$STAGING_DEPLOY_DIR/compose.yaml.candidate"
          scp "${ssh_options[@]}" \
            deploy/deploy-staging.sh \
            "$target:$STAGING_DEPLOY_DIR/deploy-staging.sh"

          ssh "${ssh_options[@]}" "$target" \
            "chmod 700 '$STAGING_DEPLOY_DIR/deploy-staging.sh' && cd '$STAGING_DEPLOY_DIR' && ./deploy-staging.sh deploy '$IMAGE' '$EXPECTED_SHA'"

          base_url="${STAGING_URL%/}"
          smoke_ok=true

          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            "$base_url/healthz" >/dev/null || smoke_ok=false

          version_json="$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            "$base_url/version.json")" || smoke_ok=false

          if [[ "$version_json" != *"\"commit\":\"$EXPECTED_SHA\""* ]]; then
            echo "Staging version does not match $EXPECTED_SHA" >&2
            smoke_ok=false
          fi

          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            "$base_url/" >/dev/null || smoke_ok=false

          if [[ "$smoke_ok" != true ]]; then
            echo "External smoke checks failed; rolling back" >&2
            ssh "${ssh_options[@]}" "$target" \
              "cd '$STAGING_DEPLOY_DIR' && ./deploy-staging.sh rollback"
            exit 1
          fi

          ssh "${ssh_options[@]}" "$target" \
            "cd '$STAGING_DEPLOY_DIR' && ./deploy-staging.sh confirm"

      - name: Verify staging prerequisites without deployment
        if: >-
          (github.event_name == 'pull_request' && github.head_ref == 'fix/staging-vpn-ssh-timeout') ||
          (github.event_name == 'workflow_dispatch' && inputs.staging_action == 'connectivity')
        shell: bash
        run: |
          set -euo pipefail

          ssh_options=(
            -i "$HOME/.ssh/staging_deploy"
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o ConnectionAttempts=2
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=5
            -o ServerAliveCountMax=2
            -o StrictHostKeyChecking=yes
          )

          ssh "${ssh_options[@]}" "$STAGING_USER@$STAGING_HOST" \
            "docker version >/dev/null &&
             docker compose version >/dev/null &&
             docker network inspect staging-app >/dev/null &&
             test -d '$STAGING_DEPLOY_DIR' &&
             test -f '$STAGING_DEPLOY_DIR/.env' &&
             test -f '$STAGING_DEPLOY_DIR/compose.yaml'"

          echo "VPN, SSH, Docker, staging network, and deployment files are ready"

      - name: Disconnect staging VPN
        if: always()
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/staging-openvpn.pid"
          if [[ -s "$pid_file" ]]; then
            sudo kill "$(cat "$pid_file")" 2>/dev/null || true
          fi
