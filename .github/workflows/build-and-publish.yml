name: Build and publish develop image

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Validate deployment scripts
        run: |
          bash -n deploy/deploy-staging.sh
          bash -n deploy/poll-staging-image.sh

      - name: Validate staging Compose configuration
        env:
          FRONTEND_IMAGE: ghcr.io/example/frontend:develop-0000000000000000000000000000000000000000
          BACKEND_UPSTREAM: http://api:8080
          APP_NETWORK: staging-app
          FRONTEND_BIND: 127.0.0.1
          FRONTEND_PORT: 8080
        run: docker compose -f deploy/compose.staging.yaml config >/dev/null

  build-and-publish:
    name: Build and publish Docker image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate build metadata
        id: metadata
        shell: bash
        run: |
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:develop-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:develop
          build-args: |
            APP_VERSION=develop
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            VITE_API_BASE_URL=/api
            VITE_APP_NAME=crumb
            VITE_SUPPORT_EMAIL=support@example.com
            VITE_PROFILE_API_MODE=remote
          cache-from: type=gha
          cache-to: type=gha,mode=max
