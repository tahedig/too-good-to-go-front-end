services:
  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must reference an immutable commit-tagged image}
    pull_policy: always
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
