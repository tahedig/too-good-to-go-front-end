server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Keeping the upstream in a variable allows Nginx
    # to start even if the backend is temporarily unavailable.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $backend_upstream "${BACKEND_UPSTREAM}";

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # The browser calls /api/* while the Go API exposes routes at /*.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
